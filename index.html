<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#6b7280;--brand:#1f4e78;--gold:#d4af37;--line:#e5e7eb}
*{box-sizing:border-box} body{margin:0;font-family:Inter,"Microsoft YaHei",Arial;background:var(--bg);color:var(--ink)}
header{background:#111827;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:22px} header small{color:#cbd5e1}
.wrap{padding:20px;max-width:1600px;margin:auto} .cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 3px 12px rgba(0,0,0,.04)}
.kpi b{font-size:26px;display:block;margin-top:6px} .muted{color:var(--muted);font-size:12px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px} input,select,button{border:1px solid #d1d5db;border-radius:8px;padding:9px 10px;background:#fff}
button{cursor:pointer;background:var(--brand);color:#fff;border:none} button.secondary{background:#fff;color:var(--ink);border:1px solid #d1d5db}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px}
.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;max-height:68vh}
table{border-collapse:collapse;width:100%;font-size:13px} th,td{padding:10px;border-bottom:1px solid #eef0f3;text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:#eef4fa;z-index:2} tr:hover{background:#f8fafc}
.badge{padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700} .ap{background:#fee2e2;color:#991b1b} .a{background:#fef3c7;color:#92400e}
.score{font-weight:700} .detail h2{margin-top:0} .detail dl{display:grid;grid-template-columns:110px 1fr;gap:8px;font-size:13px}
.detail dt{color:var(--muted)} .detail dd{margin:0} .tabs{display:flex;gap:8px;margin:14px 0} .tabs button{background:#e5e7eb;color:#111827}
.notice{background:#fff7ed;border:1px solid #fed7aa;padding:10px;border-radius:8px;font-size:12px;margin-top:12px}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div><h1>晚礼服外贸获客</h1><small>Turkey Lead Intelligence & Outreach CRM — MVP</small></div><div>目标：300家高质量土耳其客户</div></header>
<div class="wrap">
<div class="cards" id="kpis"></div>
<div class="toolbar">
<input id="q" placeholder="搜索公司、类型、产品线…" oninput="render()">
<select id="priority" onchange="render()"><option value="">全部等级</option><option>A+</option><option>A</option><option>B</option></select>
<select id="line" onchange="render()"><option value="">全部产品线</option><option value="premium">简约高级</option><option value="couture">重工礼服</option></select>
<button class="secondary" onclick="document.getElementById('file').click()">导入已有客户表</button>
<input id="file" type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="importFile(event)">
<button onclick="exportCsv()">导出当前数据</button>
</div>
<div class="grid">
<div class="tablewrap"><table><thead><tr>
<th>等级</th><th>公司</th><th>客户类型</th><th>简约匹配</th><th>重工匹配</th><th>价格</th><th>进口概率</th><th>建议产品线</th><th>阶段</th>
</tr></thead><tbody id="rows"></tbody></table></div>
<div class="card detail" id="detail"><h2>客户详情</h2><div class="muted">点击左侧客户查看画像。</div>

</div></div>

xample": "Luxury evening dresses", "import_probability": "High", "buyer_value": "Very high", "contact_email": "pernottefashion@gmail.com", "whatsapp": "+90 537 988 3572", "recommended_line": "Both premium and heavy embellished wholesale styles", "evidence": "Laleli wholesale business, broad size range, orders through WhatsApp/Telegram.", "source_url": "https://www.pernotte.com/", "notes": "Strong trading-company profile; confirm China import openness."}, {"company": "Dekolte Shop", "website": "https://dekolteshop.com/en/", "country": "Turkey", "city": "Istanbul", "customer_type": "Wholesale evening-dress supplier / trader", "priority": "A", "stage": "New lead", "premium_fit": 94, "couture_fit": 75, "price_status": "Wholesale price not public", "price_example": "Not public", "import_probability": "Medium–High", "buyer_value": "Very high", "contact_email": "", "whatsapp": "", "recommended_line": "Fast-moving premium satin, sequin and plus-size dresses", "evidence": "Targets boutiques, retailers and online sellers; regular stock updates and broad eveningwear categories.", "source_url": "https://dekolteshop.com/en/", "notes": "Potential buyer, competitor or distribution partner; qualification call required."}, {"company": "Polen Poe", "website": "https://polenpoe.com/", "country": "Turkey", "city": "Istanbul", "customer_type": "Luxury wholesale brand", "priority": "A", "stage": "New lead", "premium_fit": 90, "couture_fit": 84, "price_status": "Wholesale access required", "price_example": "Not public", "import_probability": "Medium", "buyer_value": "High", "contact_email": "online@polenpoe.com", "whatsapp": "", "recommended_line": "Premium wholesale dresses and selective couture pieces", "evidence": "Wholesale luxury-dress supplier serving boutiques internationally.", "source_url": "https://polenpoe.com/", "notes": "May be a competitor; still valuable for partnership or production overflow."}, {"company": "World Wide Couture", "website": "https://worldwidecouture.com/", const aliases={company:["company","公司","客户名称","Company Name"],website:["website","官网","url"],contact_email:["contact_email","email","邮箱"],whatsapp:["whatsapp","电话","手机"],notes:["notes","备注"]};
function normalize(row){let out={country:"Turkey",priority:"B",stage:"Imported",premium_fit:0,couture_fit:0,customer_type:"Imported lead",price_status:"Unknown",import_probability:"Unknown",recommended_line:"Needs analysis"};for(const [k,arr] of Object.entries(aliases))for(const a of arr)if(row[a]!=null&&row[a]!==""){out[k]=String(row[a]);break}return out}
function filtered(){let q=document.getElementById('q').value.toLowerCase(),p=document.getElementById('priority').value,l=document.getElementById('line').value;return leads.filter(x=>(!p||x.priority===p)&&(!l||(l==="premium"?x.premium_fit>=80:x.couture_fit>=80))&&(!q||JSON.stringify(x).toLowerCase().includes(q)))}

function importFile(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=ev=>{let wb=XLSX.read(ev.target.result,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{defval:""});let added=rows.map(normalize).filter(x=>x.company);leads=leads.concat(added);render();alert(`已导入 ${added.length} 条记录。下一步需做去重和AI字段识别。`)};reader.readAsArrayBuffer(file)}
