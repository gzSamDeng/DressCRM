name: Release Codex bundle
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/codex-release.yml
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply release
        run: |
          set -eu
          base64 -d .codex/sync.bundle.b64 > /tmp/release.bundle
          git fetch /tmp/release.bundle main:refs/remotes/codex/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tree="$(git show -s --format=%T codex/main)"
          commit="$(echo 'feat: integrate web phone and WhatsApp Business' | git commit-tree "$tree" -p HEAD -p codex/main)"
          git push origin "$commit:main"
