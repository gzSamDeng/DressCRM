name: Apply Codex release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/codex-sync.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified release tree
        shell: bash
        run: |
          set -eu
          base64 -d .codex/sync.bundle.b64 > /tmp/codex.bundle
          git fetch /tmp/codex.bundle main:refs/remotes/codex/main
          base_tree="$(git show -s --format=%T codex/main^)"
          if [ -z "$(git log --format=%T HEAD | grep -Fxm1 "$base_tree")" ]; then
            echo "Release base tree is not present in main history"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          release_tree="$(git show -s --format=%T codex/main)"
          release_commit="$(printf '%s
' 'feat: integrate web phone and WhatsApp Business' | git commit-tree "$release_tree" -p HEAD -p codex/main)"
          git push origin "$release_commit:main"
