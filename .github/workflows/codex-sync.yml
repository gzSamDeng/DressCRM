name: Codex one-time sync
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/codex-sync.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge tested local commits
        run: |
          tr -d '\n ' < .codex/sync.bundle.b64 | base64 --decode > /tmp/codex.bundle
          git fetch /tmp/codex.bundle main:refs/remotes/codex-payload/main
          git merge-base --is-ancestor 61b2a58bbaabd1aee1d8dd3a26d4fdbd4b670a22 refs/remotes/codex-payload/main
          git merge-base --is-ancestor 61b2a58bbaabd1aee1d8dd3a26d4fdbd4b670a22 HEAD
          git config user.name 'Codex Sync'
          git config user.email 'codex-sync@users.noreply.github.com'
          tree=$(git rev-parse 'refs/remotes/codex-payload/main^{tree}')
          merge=$(printf '%s\n' 'Deploy shared Gmail OAuth and lead updates' | git commit-tree "$tree" -p HEAD -p refs/remotes/codex-payload/main)
          git push origin "$merge":main
